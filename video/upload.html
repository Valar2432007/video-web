<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #8d2626;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: min(100% - 32px, 420px);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #0a0404;
        }

        .card {
            background: #cdc6c6;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #753333;
        }

        button,
        .back-btn {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #6e2020;
            font-size: 16px;
        }

        button:hover {
            background: #c56161;
        }

        .back-btn {
            margin-top: 20px;
            background: #333;
            padding: 10px 20px;
        }

        .back-btn:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Upload Video</h1>

        <section class="card">
            <input id="videoTitle" type="text" placeholder="Video Title">
            <input id="videoUrl" type="text" placeholder="Video URL">
            <button onclick="uploadVideo()">Upload</button>
        </section>

        <a href="index.html" class="back-btn">Back Home</a>
    </main>

    <script>
        function uploadVideo() {
            const title = document.getElementById("videoTitle").value.trim();
            const url = document.getElementById("videoUrl").value.trim();

            if (title === "" || url === "") {
                alert("Enter video title and URL");
                return;
            }

            const uploads = JSON.parse(localStorage.getItem("uploads")) || [];
            uploads.push({ title, url });
            localStorage.setItem("uploads", JSON.stringify(uploads));

            alert("Video uploaded successfully");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
